<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,
body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:"Segoe UI Variable","Segoe UI",sans-serif;
}

*{
  box-sizing:border-box;
}

#news{
  padding:4px;
}

.newsItem{
  display:block;
  padding:3px 12px;
  margin-bottom:6px;
  border-radius:10px;
  font-weight:500;
  cursor:pointer;
  text-decoration:none;
  transition:all .25s ease;
  overflow:hidden;
}

.newsInner{
  display:flex;
  align-items:center;
  gap:4px;
  line-height:1.1;
  min-width:0;
  overflow:hidden;
}

.date{
  color:#16B0F2;
  font-size:12px;
  flex-shrink:0;
  white-space:nowrap;
  width:auto;
  margin-right:2px;
}

.dept{
  font-size:12px;
  padding:3px 8px;
  border-radius:999px;
  color:#fff;
  background:#16B0F2;
  font-weight:600;
  box-shadow:0 1px 4px rgba(22,176,242,.35);
  flex-shrink:0;
  white-space:nowrap;
  letter-spacing:.2px;
}

.important{
  display:inline-flex;
  font-size:10px;
  padding:2px 6px;
  border-radius:999px;
  color:#fff;
  background:#d13438;
  font-weight:700;
  box-shadow:0 0 18px rgba(209,52,56,1);
  flex-shrink:0;
  white-space:nowrap;
  animation:blinkImportant 1s infinite;
}

.new{
  display:inline-flex;
  font-size:10px;
  padding:2px 6px;
  border-radius:999px;
  background:#ffd60a;
  color:#000;
  font-weight:800;
  box-shadow:0 0 16px rgba(255,214,10,1);
  flex-shrink:0;
  white-space:nowrap;
  animation:blinkNew 1s infinite;
}

.title{
  flex-grow:1;
  min-width:0;
  font-size:13px;
  color:#000;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.arrow{
  font-size:18px;
  color:#605e5c;
  margin-left:8px;
  flex-shrink:0;
  white-space:nowrap;
}

.error{
  padding:12px;
  color:#d13438;
  font-size:13px;
}

#lastUpdate{
  font-size:11px;
  color:#888;
  padding:0 8px 6px;
  text-align:right;
}

.newsItem{
  opacity:0;
  transform:translateY(-20px) scale(.95);
  animation:newsIn .5s ease forwards;
}

@keyframes newsIn{

  0%{
    opacity:0;
    transform:translateX(-30px);
  }

  100%{
    opacity:1;
    transform:translateX(0);
  }

}



@keyframes blinkImportant{
  0%,100%{
    opacity:1;
    transform:scale(1);
    box-shadow:0 0 18px rgba(209,52,56,1);
  }
  50%{
    opacity:.35;
    transform:scale(.96);
    box-shadow:0 0 4px rgba(209,52,56,.4);
  }
}

@keyframes blinkNew{
  0%,100%{
    opacity:1;
    transform:scale(1);
    box-shadow:0 0 16px rgba(255,214,10,1);
  }
  50%{
    opacity:.35;
    transform:scale(.96);
    box-shadow:0 0 4px rgba(255,214,10,.4);
  }
}
</style>
</head>

<body>

<div id="lastUpdate"></div>
<div id="news"></div>

<script>
const script = document.createElement('script');

script.id = 'newsDataScript';

script.src =
'https://digitalgojp.sharepoint.com/sites/NTA_IBHub12/SiteAssets/news/news-data-test.js.js?v='
+ Date.now();

script.onload = () => {

const app = document.getElementById('news');

app.innerHTML = '';

document.getElementById('lastUpdate').textContent =
  '最終生成: ' +
  (window.newsGeneratedTime || '取得中');

const data = window.newsV2Data || [];

  data.forEach((item,index)=>{

    const title = item.title || '';
    const date = item.publicationDate || '';
    const dept = item.department || '';
    const url = item.sourceUrl || '#';
    const important = item.important === true;

    const isNew = isToday(date);

    const card = document.createElement('a');

    card.className = 'newsItem';
card.style.animationDelay = `${index * 0.12}s`;
card.href = url;
card.target = '_top';

    card.style.border = important
      ? '1px solid #f3d6d8'
      : '1px solid #d0d0d0';

    card.style.borderLeft = important
      ? '4px solid #d13438'
      : '4px solid transparent';

    card.style.backgroundColor = important
      ? '#fff5f5'
      : index % 2 === 0
        ? '#ffffff'
        : '#f7f7f7';

    card.style.boxShadow = important
      ? '0 0 10px rgba(209,52,56,.18)'
      : 'none';

    card.addEventListener('mouseenter',()=>{

  card.style.transform = 'translateY(-4px)';

  card.style.boxShadow = important
    ? '0 8px 18px rgba(209,52,56,.22)'
    : '0 8px 18px rgba(0,0,0,.12)';

});

card.addEventListener('mouseleave',()=>{

  card.style.transform = 'translateY(0)';

  card.style.backgroundColor = important
    ? '#fff5f5'
    : index % 2 === 0
      ? '#ffffff'
      : '#f7f7f7';

  card.style.boxShadow = important
    ? '0 0 10px rgba(209,52,56,.18)'
    : 'none';

});

    card.innerHTML = `
      <div class="newsInner">

        <span class="date">
          ${formatDate(date)}
        </span>

        <span class="dept">
          ${escapeHtml(dept)}
        </span>

        ${
          important
          ? `<span class="important">重要!</span>`
          : ''
        }

        ${
          isNew
          ? `<span class="new">NEW!</span>`
          : ''
        }

        <span class="title">
          ${escapeHtml(title)}
        </span>

        <span class="arrow">
          ›
        </span>

      </div>
    `;

    app.appendChild(card);

  });

};

script.onerror = () => {

  document.getElementById('news').innerHTML =
  '<div class="error">表示できません。</div>';

};

document.body.appendChild(script);

function formatDate(value){

  const d = new Date(value);

  if(isNaN(d)){
    return value || '';
  }

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');

  return `${y}/${m}/${day}`;

}

function isToday(value){

  const d = new Date(value);

  if(isNaN(d)){
    return false;
  }

  const now = new Date();

  return d.getFullYear() === now.getFullYear()
    && d.getMonth() === now.getMonth()
    && d.getDate() === now.getDate();

}

function escapeHtml(str){

  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}
setInterval(() => {

  const oldScript = document.getElementById('newsDataScript');

  if(oldScript){
    oldScript.remove();
  }

  const reloadScript = document.createElement('script');

  reloadScript.id = 'newsDataScript';

  reloadScript.src =
    'https://digitalgojp.sharepoint.com/sites/NTA_IBHub12/SiteAssets/news/news-data.js?v='
    + Date.now();

  reloadScript.onload = () => {

    const currentGeneratedTime =
      document.getElementById('lastUpdate').textContent.replace('最終生成: ', '');

    const newGeneratedTime =
      window.newsGeneratedTime || '取得中';

    if(currentGeneratedTime !== newGeneratedTime){
      location.reload();
    }

  };

  document.body.appendChild(reloadScript);

}, 5000);

</script>

</body>
</html>
