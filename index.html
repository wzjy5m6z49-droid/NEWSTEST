<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
html,
body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:"Segoe UI Variable","Segoe UI",sans-serif;
}

*{
  box-sizing:border-box;
}

#news{
  padding:4px;
}

.newsItem{
  display:block;
  padding:3px 12px;
  margin-bottom:6px;
  border-radius:10px;
  font-weight:500;
  cursor:pointer;
  text-decoration:none;
  transition:all .25s ease;
  overflow:hidden;
}

.newsInner{
  display:flex;
  align-items:center;
  gap:4px;
  line-height:1.1;
  min-width:0;
  overflow:hidden;
}

.date{
  color:#16B0F2;
  font-size:12px;
  width:60px;
  flex-shrink:0;
  white-space:nowrap;
}

.dept{
  font-size:12px;
  padding:3px 8px;
  border-radius:999px;
  color:#fff;
  background:#16B0F2;
  font-weight:600;
  box-shadow:0 1px 4px rgba(22,176,242,.35);
  flex-shrink:0;
  white-space:nowrap;
}

.important{
  display:inline-flex;
  font-size:10px;
  padding:2px 6px;
  border-radius:999px;
  color:#fff;
  background:#d13438;
  font-weight:700;
  box-shadow:0 0 14px rgba(209,52,56,.95);
  flex-shrink:0;
  white-space:nowrap;
}

.new{
  display:inline-flex;
  font-size:10px;
  padding:2px 6px;
  border-radius:999px;
  background:#ffd60a;
  color:#000;
  font-weight:800;
  box-shadow:0 0 10px rgba(255,214,10,.85);
  flex-shrink:0;
  white-space:nowrap;
}

.title{
  flex-grow:1;
  min-width:0;
  font-size:13px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.arrow{
  font-size:18px;
  margin-left:8px;
  flex-shrink:0;
  white-space:nowrap;
}

.error{
  padding:12px;
  color:#d13438;
  font-size:13px;
}
</style>
</head>

<body>

<div id="news"></div>

<script>

const script = document.createElement('script');

script.src =
'https://digitalgojp.sharepoint.com/sites/NTA_IBHub12/SiteAssets/newsv2/newsv2-data.js?v='
+ Date.now();

script.onload = () => {

  const app = document.getElementById('news');

  app.innerHTML = '';

  const data = window.newsV2Data || [];

  data.forEach((item,index)=>{

    const title = item.title || '';
    const date = item.publicationDate || '';
    const dept = item.department || '';
    const url = item.sourceUrl || '#';
    const important = item.important === true;

    const isNew = isNewItem(date,1);

    const card = document.createElement('a');

    card.className = 'newsItem';

    card.href = url;
    card.target = '_self';

    card.style.border = important
      ? '1px solid #f3d6d8'
      : '1px solid #d0d0d0';

    card.style.borderLeft = important
      ? '4px solid #d13438'
      : '4px solid transparent';

    card.style.backgroundColor = important
      ? '#fff5f5'
      : index % 2 === 0
        ? '#ffffff'
        : '#f7f7f7';

    card.style.boxShadow = important
      ? '0 0 10px rgba(209,52,56,.18)'
      : 'none';

    card.addEventListener('mouseenter',()=>{

      card.style.backgroundColor = '#eef6ff';

      card.style.transform = important
        ? 'translateY(-3px)'
        : 'translateY(-1px)';

      card.style.boxShadow = important
        ? '0 6px 16px rgba(209,52,56,.35)'
        : '0 2px 8px rgba(0,0,0,.10)';
    });

    card.addEventListener('mouseleave',()=>{

      card.style.transform = 'none';

      card.style.backgroundColor = important
        ? '#fff5f5'
        : index % 2 === 0
          ? '#ffffff'
          : '#f7f7f7';

      card.style.boxShadow = important
        ? '0 0 10px rgba(209,52,56,.18)'
        : 'none';
    });

    card.innerHTML = `
      <div class="newsInner">

        <span class="date">
          ${formatDate(date)}
        </span>

        <span class="dept">
          ${escapeHtml(dept)}
        </span>

        ${
          important
          ? `<span class="important">重要!</span>`
          : ''
        }

        ${
          isNew
          ? `<span class="new">NEW!</span>`
          : ''
        }

        <span class="title">
          ${escapeHtml(title)}
        </span>

        <span class="arrow">
          ›
        </span>

      </div>
    `;

    app.appendChild(card);

  });

};

script.onerror = () => {

  document.getElementById('news').innerHTML =
  '<div class="error">newsv2-data.js の読み込み失敗</div>';

};

document.body.appendChild(script);

function formatDate(value){

  const d = new Date(value);

  if(isNaN(d)){
    return value;
  }

  return d.toLocaleDateString(
    'ja-JP',
    {
      month:'2-digit',
      day:'2-digit'
    }
  );

}

function isNewItem(value,days){

  const d = new Date(value);

  if(isNaN(d)){
    return false;
  }

  const limit = new Date();

  limit.setDate(
    limit.getDate() - days
  );

  return d >= limit;

}

function escapeHtml(str){

  return String(str)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
